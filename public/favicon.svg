<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Ultra-rich Obsidian Glass -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24242A" />
      <stop offset="35%" stop-color="#141418" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Chamfer / Beveled Edge Highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Top Ambient Soft Light -->
    <radialGradient id="topGlow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.09)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Emerald Glow behind Dot -->
    <radialGradient id="emeraldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#059669" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>

    <!-- Emerald Gem Dot Gradient -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Lettermark Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F4F4F5" />
    </linearGradient>

    <!-- Soft Depth Shadow -->
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Squircle Base (Apple iOS standard curvature) -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- Ambient Top Soft Sheen -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#topGlow)" />

  <!-- Chamfer Edge Stroke -->
  <rect x="2" y="2" width="508" height="508" rx="113" ry="113" fill="none" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Emerald Ambient Glow -->
  <circle cx="367.42" cy="367.00" r="68" fill="url(#emeraldAura)" />

  <!-- D Lettermark -->
  <path d="M 217.14 391.00 C 198.65 391.00, 182.14 386.61, 167.63 377.83 C 153.12 369.06, 141.65 357.06, 133.22 341.85 C 124.80 326.63, 120.58 309.78, 120.58 291.29 C 120.58 272.56, 124.80 255.71, 133.22 240.73 C 141.65 225.75, 153.18 213.81, 167.81 204.91 C 182.44 196.02, 198.76 191.57, 216.79 191.57 C 231.30 191.57, 244.23 194.44, 255.58 200.17 C 266.94 205.91, 275.89 213.93, 282.44 224.23 L 275.42 233.70 L 275.42 121.00 L 321.42 121.00 L 321.42 386.79 L 277.88 386.79 L 277.88 349.92 L 282.79 359.05 C 276.24 369.35, 267.11 377.25, 255.41 382.75 C 243.70 388.25, 230.95 391.00, 217.14 391.00 Z M 222.05 348.87 C 232.59 348.87, 241.83 346.41, 249.79 341.49 C 257.75 336.58, 264.01 329.79, 268.57 321.13 C 273.14 312.47, 275.42 302.52, 275.42 291.29 C 275.42 280.28, 273.14 270.40, 268.57 261.62 C 264.01 252.84, 257.75 245.99, 249.79 241.08 C 241.83 236.16, 232.59 233.70, 222.05 233.70 C 211.75 233.70, 202.51 236.22, 194.32 241.25 C 186.12 246.29, 179.75 253.07, 175.18 261.62 C 170.62 270.16, 168.33 280.05, 168.33 291.29 C 168.33 302.52, 170.62 312.47, 175.18 321.13 C 179.75 329.79, 186.12 336.58, 194.32 341.49 C 202.51 346.41, 211.75 348.87, 222.05 348.87 Z" fill="url(#letterGrad)" filter="url(#markShadow)" />

  <!-- Emerald Dot -->
  <circle cx="367.42" cy="367.00" r="24.00" fill="url(#dotGrad)" filter="url(#markShadow)" />
</svg>
